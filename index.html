<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إلى لولو</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#fffdf8,#f7eee5 55%,#eadbd0);color:#4b3b37;font-family:Georgia,'Times New Roman',serif}main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 15px}.card{text-align:center;width:min(700px,94vw)}.hint{font:13px system-ui;color:#947c70;letter-spacing:2px;margin-bottom:8px}.bouquet{position:relative;width:320px;height:350px;margin:auto;cursor:pointer;filter:drop-shadow(0 15px 18px #6b4b3818)}.stem{position:absolute;left:158px;top:115px;width:5px;height:200px;background:#70835d;border-radius:5px;transform:rotate(2deg)}.leaf{position:absolute;width:70px;height:30px;background:#7d9168;border-radius:100% 0;}.l1{left:65px;top:220px;transform:rotate(-22deg)}.l2{right:55px;top:245px;transform:scaleX(-1) rotate(-20deg)}.wrap{position:absolute;left:64px;top:245px;width:195px;height:90px;background:#e5d4c3;clip-path:polygon(0 0,100% 0,76% 100%,50% 72%,24% 100%)}.ribbon{position:absolute;left:148px;top:278px;width:27px;height:48px;background:#9b5966;clip-path:polygon(0 0,100% 0,82% 100%,50% 72%,18% 100%)}.flower{position:absolute;width:82px;height:82px;animation:float 3.8s ease-in-out infinite}.f1{left:42px;top:62px}.f2{left:112px;top:25px;animation-delay:.3s}.f3{right:40px;top:62px;animation-delay:.6s}.f4{left:82px;top:105px;animation-delay:.9s}.f5{right:76px;top:108px;animation-delay:1.2s}.petal{position:absolute;left:20px;top:4px;width:42px;height:54px;border-radius:60%;transform-origin:21px 37px}.petal:nth-child(1){transform:rotate(0) translateY(-11px)}.petal:nth-child(2){transform:rotate(72deg) translateY(-11px)}.petal:nth-child(3){transform:rotate(144deg) translateY(-11px)}.petal:nth-child(4){transform:rotate(216deg) translateY(-11px)}.petal:nth-child(5){transform:rotate(288deg) translateY(-11px)}.pink .petal{background:#d78b9b}.cream .petal{background:#e6c59f}.rose .petal{background:#c86d81}.center{position:absolute;z-index:2;left:31px;top:31px;width:20px;height:20px;background:#c39a55;border-radius:50%}@keyframes float{50%{transform:translateY(-5px) rotate(1deg)}}.letter{margin:auto;max-width:650px;padding:26px 20px;background:#fffaf5bb;border:1px solid #8b6d5c22;border-radius:24px;box-shadow:0 12px 35px #5d43350f;opacity:0;transform:translateY(18px);transition:1s}.letter.show{opacity:1;transform:none}.line{font-size:clamp(20px,4.6vw,30px);line-height:2;margin:0 0 16px;opacity:0;transform:translateY(8px);transition:.8s}.line.show{opacity:1;transform:none}.signature{font-size:25px;color:#9b5966;opacity:0;transition:1s}.signature.show{opacity:1}button{margin-top:18px;border:0;background:#9b5966;color:white;padding:12px 24px;border-radius:999px;font-size:14px;cursor:pointer;box-shadow:0 8px 20px #9b596633}</style></head><body><main><div class="card"><div class="hint">إلى لولو</div><div class="bouquet" id="bouquet"><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="flower f1 pink"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div><div class="flower f2 cream"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div><div class="flower f3 rose"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div><div class="flower f4 rose"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div><div class="flower f5 pink"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div><div class="wrap"></div><div class="ribbon"></div></div><div class="letter" id="letter"><p class="line">أيها النورُ سلامًا وخشوعًا<br>أيها المعبدُ صمتًا ورُكوعًا</p><p class="line">ملكتِ قلبي ولُبّي، رهبةٌ<br>عصفتْ بالقلبِ واللُّبِّ جميعًا</p><p class="line">يا جنانَ الخُلدِ يا أجملَ ما<br>قد رأته عينايَ حبًّا وربيعًا</p><p class="line">كلما امتدت يدي نحوَكِ شوقًا<br>زاد في قلبي من الحبِّ ضياءً</p><p class="line">ولكِ من قلبي سلامٌ وخشوعٌ<br>ولكِ العمرُ محبةً وربيعًا</p><div class="signature">لولو ♡</div></div><button id="open">افتحي الإهداء</button></div></main><script>let opened=false;function reveal(){if(opened)return;opened=true;document.getElementById('letter').classList.add('show');document.getElementById('open').style.display='none';document.querySelectorAll('.line').forEach((e,i)=>setTimeout(()=>e.classList.add('show'),500+i*650));setTimeout(()=>document.querySelector('.signature').classList.add('show'),3750)}document.getElementById('open').onclick=reveal;document.getElementById('bouquet').onclick=reveal;</script></body></html>
